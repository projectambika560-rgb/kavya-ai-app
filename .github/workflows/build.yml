name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android files
        run: flutter create . --project-name kavya_ai_app --org com.kavya

      - name: Allow internet and set app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Kavya"#' "$M"

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=KAVYA_API=${{ secrets.KAVYA_API }} --dart-define=KAVYA_TOKEN=${{ secrets.KAVYA_TOKEN }}

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: kavya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
